name: Verify FORMA
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forma
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: forma_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forma -d forma_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://forma:test_only@localhost:5432/forma_test
      TEST_DATABASE_URL: postgresql://forma:test_only@localhost:5432/forma_test
      DEMO_MODE: 'true'
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm typecheck && pnpm lint && pnpm exec prettier --check .
      - run: pnpm test && pnpm test:integration && pnpm test:vercel
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          node apps/api/dist/src/main.js > /tmp/forma-api.log 2>&1 &
          pnpm --filter @forma/web dev > /tmp/forma-web.log 2>&1 &
          for i in $(seq 1 30); do curl --fail http://localhost:5173/api/v1/ready && break; sleep 2; done
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report
            docs/screenshots
      - run: docker compose config -q
      - name: Verify Docker deployment from a clean database
        run: |
          APP_ORIGIN=http://localhost:8080 docker compose up --build -d --wait
          docker compose exec -T api pnpm db:seed
          curl --fail http://localhost:8080/api/v1/ready
          curl --fail http://localhost:8080/api/v1/auth/login -H 'Content-Type: application/json' -H 'Origin: http://localhost:8080' -H 'X-CSRF-Protection: 1' -d '{"email":"client@forma.example","password":"FormaDemo2026!"}'
      - name: Docker logs
        if: failure()
        run: |
          docker compose logs --no-color
          docker compose ps -a
          for id in $(docker compose ps -aq); do docker inspect --format '{{json .State.Health}}' "$id"; done
